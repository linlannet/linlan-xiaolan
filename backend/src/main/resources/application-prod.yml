# 开发环境配置
server:
    # 服务器的HTTP端口，默认为8310
    port: 8310
    servlet:
        # 应用的访问路径
        context-path: /xiaolan_backend
    tomcat:
        # tomcat的URI编码
        uri-encoding: UTF-8
        # 连接数满后的排队数，默认为100
        accept-count: 1000
        threads:
            # tomcat最大线程数，默认为200
            max: 800
            # Tomcat启动初始化的线程数，默认值10
            min-spare: 100

# 日志配置
logging:
    level:
        net.linlan: debug
        org.springframework: warn

# 数据源配置
